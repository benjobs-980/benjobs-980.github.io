<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Offline Match</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: white;
      color: black;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      text-align: center;
      padding: 60px 20px;
      font-size: 32px;
      font-weight: bold;
    }

    .content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-display: black;
    }

    .options {
      display: flex;
      gap: 40px;
      width: 100%;
      max-width: 800px;
    }

    .card {
      flex: 1;
      background: whitesmoke;
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    .card h2 {
      margin-bottom: 20px;
      font-size: 28px;
    }

    .btn {
      display: inline-block;
      padding: 15px 30px;
      background: #d6dceb;
      color: rgb(0, 0, 0);
      text-decoration: none;
      border-radius: 15px;
      font-size: 18px;
    }

    .btn:hover {
      background: #17be30;
    }

    @media (max-width: 700px) {
      .options {
        flex-direction: column;
        gap: 20px;
      }
    }

/* Page wrapper for ribbons */
  .page-wrapper {
  min-height: 100vh;
  position: relative;
  background: #ffffff;
}

.ribbon {
  width: 100%;
  height: 48px;
  background: #7292d2;
}

.ribbon-top {
  position: absolute;
  top: 0;
  left: 0;
}

.ribbon-bottom {
  position: absolute;
  bottom: 0;
  left: 0;
}

  </style>
</head>

<body>

  <div class="page-wrapper">

  <div class="ribbon ribbon-top"></div>
  <header>
    <h2>OFFLINEmatch.ORG</h2>
    <p>We are NOT in the dating BUSINESS</p>
  </header>

  <div class="content">
    <div class="options">

      <!-- LEFT SIDE -->
      <div class="card">
        <h2>Male</h2>
        <a class="btn" href="https://docs.google.com/forms/d/e/1FAIpQLScla--QHRirZHPey3kELZIGSqljhuGEL39u4jKo8oVG8C23Yg/viewform" target="_blank">
          Continue
        </a>
      </div>

      <!-- RIGHT SIDE -->
      <div class="card">
        <h2>Female</h2>
        <a class="btn" href="https://docs.google.com/forms/d/e/1FAIpQLSed8M2pD61OwbPS8ibgq5hoimYiudekTPwFmUuW_OmnxbNq8A/viewform?pli=1" target="_blank">
          Continue
        </a>
      </div>
      <div class="ribbon ribbon-bottom"></div>
    </div>
  </div>

</body>
</html>
